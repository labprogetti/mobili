<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Scrivania matrimoniale</title>
  <link rel="stylesheet" href="../assets/viewer.css">
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.2.0/dist/model-viewer.min.js"></script>
</head>
<body>
  <header class="testata">
    <h1>Scrivania matrimoniale</h1>
    <p class="ingombro" id="ingombro">Ingombro: calcolo in corso…</p>
  </header>

  <main class="contenitore">
    <div class="area" id="area">
    <model-viewer
      id="mv"
      src="scrivania-web.glb"
      alt="Modello 3D della scrivania matrimoniale"
      camera-controls
      touch-action="pan-y"
      camera-orbit="35deg 65deg 125%"
      min-camera-orbit="auto 0deg 0.3m"
      max-camera-orbit="auto auto 300%"
      field-of-view="30deg"
      interpolation-decay="120"
      environment-image="neutral"
      shadow-intensity="1"
      exposure="1"
      ar
      ar-modes="webxr scene-viewer quick-look"
      ar-scale="fixed"
      ar-placement="floor">

      <div slot="progress-bar" class="barra"><div class="barra-riempimento"></div></div>
      <button slot="ar-button" class="bottone-ar">Vedi nella stanza</button>

      <svg class="linee-quote" aria-hidden="true">
        <line data-quota="l"></line>
        <line data-quota="p"></line>
        <line data-quota="h"></line>
      </svg>
    </model-viewer>

    <div class="comandi">
      <button type="button" data-vista="fronte" aria-pressed="false">Fronte</button>
      <button type="button" data-vista="lato" aria-pressed="false">Lato</button>
      <button type="button" data-vista="pianta" aria-pressed="false">Pianta</button>
      <button type="button" data-vista="prospettiva" aria-pressed="true">Prospettiva</button>
      <button type="button" id="apri-ante" hidden>Apri anta</button>
      <button type="button" id="apri-cassetti" hidden>Apri cassetti</button>
      <button type="button" id="schermo-intero" hidden>Schermo intero</button>
      <div class="opzioni">
        <label hidden>Stanza
          <select id="modo-stanza">
            <option value="trasparente" selected>trasparente</option>
            <option value="piena">piena</option>
            <option value="nascosta">nascosta</option>
          </select>
        </label>
        <label><input type="checkbox" id="mostra-quote" checked> Quote</label>
      </div>
    </div>
    </div>

    <section class="note">
      <h2>Note</h2>
      <ol id="elenco-note"></ol>
    </section>
  </main>

  <script>
    // Da che parte guarda il fronte del mobile negli assi del modello: "+z" (predefinito,
    // = vista Fronte di SketchUp), "+x", "-z" o "-x". Regola viste e quote L/P.
    window.FRONTE = "-x";
    // "Lato" e "Prospettiva" mostrano il fianco sinistro (quello libero, con l'anta della colonna).
    window.LATO = "sinistra";

    // Misure scritte a mano: la colonna ha un fianco inclinato, e il rettangolo calcolato
    // in automatico risulterebbe più profondo del vero (75 cm invece di 50).
    window.INGOMBRO = "L 196 × P 50 (max) × H 246 cm";

    // Parti che si aprono: nomi dei gruppi di SketchUp. Cerniera vista da chi sta davanti all'anta.
    window.ANIMAZIONI = {
      ante: [
        { nome: "Anta", cerniera: "dx", angolo: 95 },     // colonna
        { nome: "Anta1", cerniera: "alto", angolo: 90 },  // pensile, a ribalta
        { nome: "Anta2", cerniera: "alto", angolo: 90 },  // pensile, a ribalta
      ],
      // dal basso verso l'alto; escono dall'apertura dell'anta della colonna
      cassetti: { nomi: ["c3", "c2", "c1"], verso: "-z", corsa: 0.22, anta: "Anta" },
    };

    // Note cliccabili sul modello.
    // Per aggiungerne una: apri la pagina con ?autore in fondo all'indirizzo,
    // orienta la vista come vuoi che la veda il falegname, fai doppio clic sul punto
    // e incolla qui la riga copiata, sostituendo "…" con il testo della nota.
    window.NOTE = [
      { testo: "Colonna: profondità 50 cm alla base (45 + 5 cm), fianco inclinato", position: "-3.040m 1.300m 0.300m", normal: "-1.000 0.000 0.000", orbit: "-110deg 75deg 2.40m" },
    ];

    // Quote disegnate come in SketchUp: punti "da" e "a" in metri (coordinate del modello,
    // si ricavano col doppio clic in modalità ?autore) e testo da mostrare.
    window.QUOTE_MANUALI = [
      { testo: "112,1 cm", da: [-3.08, 0.75, 0.64], a: [-3.08, 0.75, 1.76] }, // piano scrivania, bordo davanti
      { testo: "30 cm", da: [-2.84, 1.87, 1.20], a: [-2.54, 1.87, 1.20] },    // pensile, sopra
      { testo: "50 cm", da: [-3.04, 2.48, 0.64], a: [-2.54, 2.48, 0.64] },    // colonna, in alto
      { testo: "30 cm", da: [-3.08, 0.01, 0.343], a: [-3.08, 0.01, 0.643] },  // fronte colonna, a terra
    ];
  </script>
  <script type="module" src="../assets/viewer.js"></script>
</body>
</html>
